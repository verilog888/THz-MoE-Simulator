[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tov-moe-simulator"
version = "1.0.0"
description = "Reproducible ToV-MoE single-layer and communication-replay simulation"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "huggingface-hub", "transformers", "tokenizers", "sentencepiece", "protobuf", "python-docx"]

[project.scripts]
tov-sim = "tov_sim.run_all:main"
tov-decode-routes = "tov_sim.decode_routes:main"

[tool.setuptools.packages.find]
where = ["source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source"]
